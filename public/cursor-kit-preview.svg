<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0d13"/>
      <stop offset="100%" style="stop-color:#111622"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="100%" style="stop-color:#F7C948"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="150" y1="0" x2="150" y2="560"/>
    <line x1="300" y1="0" x2="300" y2="560"/>
    <line x1="450" y1="0" x2="450" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="750" y1="0" x2="750" y2="560"/>
  </g>

  <!-- Nav bar -->
  <rect width="900" height="52" fill="#0e1219"/>
  <rect width="900" height="1" y="52" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Logo bracket -->
  <rect x="24" y="16" width="3" height="20" rx="1.5" fill="#F5A623"/>
  <rect x="38" y="16" width="3" height="20" rx="1.5" fill="#F5A623"/>
  <text x="32" y="30" font-family="monospace" font-size="11" fill="#F5A623" text-anchor="middle">⌐</text>
  <text x="56" y="33" font-family="monospace" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="3">CURSORKIT</text>
  <!-- Nav links -->
  <text x="200" y="32" font-family="monospace" font-size="11" fill="#6b7280" letter-spacing="2">EXPLORE</text>
  <text x="290" y="32" font-family="monospace" font-size="11" fill="#F5A623" letter-spacing="2">BUILDER</text>
  <rect x="290" y="42" width="55" height="2" rx="1" fill="#F5A623"/>
  <text x="380" y="32" font-family="monospace" font-size="11" fill="#6b7280" letter-spacing="2">EMBED</text>
  <text x="455" y="32" font-family="monospace" font-size="11" fill="#6b7280" letter-spacing="2">SHOWCASE</text>

  <!-- Left sidebar - cursor list -->
  <rect x="0" y="53" width="220" height="507" fill="#0d1018"/>
  <rect x="220" y="53" width="1" height="507" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Sidebar header -->
  <text x="20" y="90" font-family="monospace" font-size="10" fill="#4b5563" letter-spacing="3">CURSOR</text>

  <!-- Category items -->
  <rect x="0" y="108" width="220" height="36" fill="#ffffff" fill-opacity="0.03"/>
  <text x="20" y="131" font-family="monospace" font-size="12" fill="#9ca3af">MINIMAL</text>
  <text x="185" y="131" font-family="monospace" font-size="11" fill="#4b5563">+14</text>

  <text x="20" y="167" font-family="monospace" font-size="12" fill="#9ca3af">GEOMETRIC</text>
  <text x="185" y="167" font-family="monospace" font-size="11" fill="#4b5563">+15</text>

  <rect x="0" y="178" width="220" height="36" fill="#F5A623" fill-opacity="0.08"/>
  <text x="20" y="201" font-family="monospace" font-size="12" fill="#F5A623">FLUID</text>
  <text x="185" y="201" font-family="monospace" font-size="11" fill="#F5A623">−12</text>

  <!-- Sub-items with indent -->
  <rect x="20" y="222" width="4" height="4" rx="2" fill="#F5A623"/>
  <text x="34" y="231" font-family="sans-serif" font-size="12" fill="#F5A623">Magnetic Blob</text>

  <text x="34" y="257" font-family="sans-serif" font-size="12" fill="#6b7280">Blob</text>
  <text x="34" y="281" font-family="sans-serif" font-size="12" fill="#6b7280">Liquid</text>
  <text x="34" y="305" font-family="sans-serif" font-size="12" fill="#6b7280">Goo</text>
  <text x="34" y="329" font-family="sans-serif" font-size="12" fill="#6b7280">Water Drop</text>

  <text x="20" y="365" font-family="monospace" font-size="12" fill="#9ca3af">TRAIL</text>
  <text x="185" y="365" font-family="monospace" font-size="11" fill="#4b5563">+9</text>
  <text x="20" y="401" font-family="monospace" font-size="12" fill="#9ca3af">REACTIVE</text>
  <text x="185" y="401" font-family="monospace" font-size="11" fill="#4b5563">+18</text>
  <text x="20" y="437" font-family="monospace" font-size="12" fill="#9ca3af">RETRO</text>
  <text x="185" y="437" font-family="monospace" font-size="11" fill="#4b5563">+11</text>

  <!-- Main content area -->
  <!-- Big headline -->
  <text x="254" y="130" font-family="serif" font-weight="700" font-size="42" fill="#ffffff">Assemble your cursor.</text>

  <!-- Subtext -->
  <text x="254" y="165" font-family="sans-serif" font-size="14" fill="#6b7280">Everything you change is written to this page's address,</text>
  <text x="254" y="185" font-family="sans-serif" font-size="14" fill="#6b7280">so the URL in your bar is already the share link.</text>

  <!-- Config panel -->
  <rect x="254" y="215" width="400" height="300" rx="10" fill="#161b25" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Config sections -->
  <text x="278" y="250" font-family="monospace" font-size="10" fill="#4b5563" letter-spacing="3">CLICK EFFECT</text>
  <rect x="278" y="262" width="352" height="1" fill="#ffffff" fill-opacity="0.06"/>

  <text x="278" y="292" font-family="sans-serif" font-size="13" fill="#9ca3af">Style</text>
  <!-- Pill options -->
  <rect x="340" y="277" width="60" height="22" rx="11" fill="#F5A623"/>
  <text x="370" y="292" font-family="sans-serif" font-size="11" fill="#000000" text-anchor="middle">Burst</text>
  <rect x="408" y="277" width="60" height="22" rx="11" fill="#1e2433"/>
  <text x="438" y="292" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ripple</text>
  <rect x="476" y="277" width="60" height="22" rx="11" fill="#1e2433"/>
  <text x="506" y="292" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Spark</text>

  <text x="278" y="330" font-family="sans-serif" font-size="13" fill="#9ca3af">Color</text>
  <!-- Color swatches -->
  <rect x="340" y="315" width="22" height="22" rx="4" fill="#F5A623"/>
  <rect x="370" y="315" width="22" height="22" rx="4" fill="#3b82f6"/>
  <rect x="400" y="315" width="22" height="22" rx="4" fill="#10b981"/>
  <rect x="430" y="315" width="22" height="22" rx="4" fill="#ef4444"/>
  <rect x="460" y="315" width="22" height="22" rx="4" fill="#a855f7"/>
  <rect x="490" y="315" width="22" height="22" rx="4" fill="#ffffff"/>
  <rect x="340" y="313" width="22" height="22" rx="4" fill="none" stroke="#F5A623" stroke-width="2" stroke-opacity="0.8"/>

  <text x="278" y="370" font-family="sans-serif" font-size="13" fill="#9ca3af">Size</text>
  <!-- Slider -->
  <rect x="340" y="360" width="260" height="3" rx="1.5" fill="#1e2433"/>
  <rect x="340" y="360" width="130" height="3" rx="1.5" fill="#F5A623"/>
  <circle cx="470" cy="361.5" r="7" fill="#F5A623"/>

  <text x="278" y="410" font-family="sans-serif" font-size="13" fill="#9ca3af">Count</text>
  <rect x="340" y="400" width="260" height="3" rx="1.5" fill="#1e2433"/>
  <rect x="340" y="400" width="180" height="3" rx="1.5" fill="#F5A623"/>
  <circle cx="520" cy="401.5" r="7" fill="#F5A623"/>

  <!-- Copy tag button -->
  <rect x="278" y="435" width="350" height="60" rx="8" fill="#0e1219"/>
  <rect x="278" y="435" width="350" height="60" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="298" y="458" font-family="monospace" font-size="10" fill="#4b5563" letter-spacing="2">EMBED TAG</text>
  <text x="298" y="480" font-family="monospace" font-size="11" fill="#6b7280">&lt;script src="cursor.js?style=magnetic-blob"&gt;</text>
  <rect x="590" y="445" width="28" height="28" rx="5" fill="#1e2433"/>
  <text x="604" y="463" font-family="monospace" font-size="11" fill="#9ca3af" text-anchor="middle">⎘</text>

  <!-- Live cursor preview (glow blob) -->
  <circle cx="750" cy="350" r="32" fill="#F5A623" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="750" cy="350" r="18" fill="#F5A623" fill-opacity="0.25"/>
  <circle cx="750" cy="350" r="8" fill="#F5A623"/>
  <circle cx="750" cy="350" r="3" fill="#ffffff"/>
  <!-- Trail dots -->
  <circle cx="726" cy="372" r="5" fill="#F5A623" fill-opacity="0.4"/>
  <circle cx="706" cy="390" r="3" fill="#F5A623" fill-opacity="0.25"/>
  <circle cx="690" cy="406" r="2" fill="#F5A623" fill-opacity="0.12"/>

  <!-- Stats -->
  <text x="680" y="460" font-family="monospace" font-size="11" fill="#4b5563">127 cursor styles</text>
  <text x="680" y="480" font-family="monospace" font-size="11" fill="#4b5563">zero dependencies</text>
  <text x="680" y="500" font-family="monospace" font-size="11" fill="#4b5563">60fps · canvas-rendered</text>

  <!-- Bottom bar -->
  <rect x="0" y="527" width="900" height="33" fill="#0e1219"/>
  <rect x="0" y="527" width="900" height="1" fill="#ffffff" fill-opacity="0.06"/>
  <text x="254" y="548" font-family="monospace" font-size="10" fill="#4b5563" letter-spacing="1">© 2026 CursorKit · One script tag. Every cursor.</text>
</svg>